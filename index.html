<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceBridge AI</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
    <style>
    :root { 
        --bg-dark: #0a0f1c;
        --bg-gradient: linear-gradient(135deg, #0a0f1c 0%, #111a2e 100%);
        --primary: #00d2ff;
        --primary-glow: rgba(0, 210, 255, 0.4);
        --secondary: #3a7bd5;
        --text-main: #ffffff;
        --text-muted: #8892b0;
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
        --personA: rgba(255, 255, 255, 0.1);
        --personB: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg-gradient); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
    
     .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; background: transparent; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
    
    /* --- AUTH SCREEN --- */
    #authScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; height: 100%; background: var(--bg-gradient); z-index: 50; }
    .auth-logo { font-size: 80px; margin-bottom: 20px; filter: drop-shadow(0 0 15px var(--primary-glow)); animation: float 4s ease-in-out infinite; }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
    .auth-title { font-size: 32px; background: linear-gradient(to right, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px; font-weight: 900; letter-spacing: 1px; }
    
    /* Glassmorphism Inputs */
    .auth-input { width: 100%; padding: 16px; margin-bottom: 15px; border: 1px solid var(--glass-border); border-radius: 12px; font-size: 16px; outline: none; transition: 0.3s; background: var(--glass-bg); color: white; backdrop-filter: blur(10px); }
    .auth-input:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 15px var(--primary-glow); }
    .auth-input::placeholder { color: var(--text-muted); }
    
    .auth-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; box-shadow: 0 4px 15px var(--primary-glow); }
    .auth-btn:active { transform: scale(0.98); box-shadow: 0 2px 10px var(--primary-glow); }
    .auth-switch { margin-top: 20px; color: var(--primary); cursor: pointer; font-size: 14px; font-weight: 600; }
    .error-msg { color: #ff4757; font-size: 14px; margin-bottom: 10px; display: none; background: rgba(255, 71, 87, 0.1); border: 1px solid rgba(255, 71, 87, 0.3); padding: 12px; border-radius: 8px; width: 100%; text-align: center; }

    /* --- MAIN APP HEADER --- */
    #mainApp { display: none; flex-direction: column; height: 100%; position: relative; background: var(--bg-gradient); }
    .main-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 15px; background: transparent; border-bottom: 1px solid var(--glass-border); z-index: 10; }
    .main-header h1 { font-size: 24px; font-weight: 800; letter-spacing: 0.5px; color: var(--primary); }
    .header-icons span { font-size: 22px; cursor: pointer; filter: drop-shadow(0 0 5px var(--primary-glow)); }
    
    .screen { display: none; flex: 1; flex-direction: column; overflow-y: auto; background: transparent; }
    .screen.active { display: flex; }

    /* Chat List Items */
    .list-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid var(--glass-border); cursor: pointer; transition: 0.2s; background: transparent; }
    .list-item:active { background: var(--glass-bg); }
    .avatar { width: 55px; height: 55px; background: linear-gradient(135deg, #00d2ff, #3a7bd5); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; margin-right: 15px; color: white; flex-shrink: 0; box-shadow: 0 0 15px var(--primary-glow); }
    .item-info { flex: 1; }
    .item-name { font-weight: bold; font-size: 17px; color: white; display: flex; justify-content: space-between; align-items: center; }
    .item-time { font-size: 12px; color: var(--text-muted); font-weight: normal; }
    .item-preview { font-size: 14px; color: var(--text-muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }

    .bottom-nav { display: flex; background: rgba(10, 15, 28, 0.9); backdrop-filter: blur(10px); border-top: 1px solid var(--glass-border); padding-bottom: 5px; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
    .nav-item.active { color: var(--primary); font-weight: bold; text-shadow: 0 0 10px var(--primary-glow); }
    .nav-icon { font-size: 24px; margin-bottom: 4px; }
    .nav-text { font-size: 12px; }

    /* --- CHAT SCREEN --- */
    #chatScreen { display: none; flex-direction: column; flex: 1; height: 100%; position: absolute; top: 0; left: 0; width: 100%; background: var(--bg-gradient); z-index: 20; overflow: hidden; }
    .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(10, 15, 28, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border); z-index: 10; }
    .chat-header-left { display: flex; align-items: center; gap: 10px; }
    .chat-header-left span { font-size: 24px; cursor: pointer; padding-right: 5px; color: var(--primary); }
    .chat-header-avatar { width: 40px; height: 40px; background: #1a2a40; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; color: var(--primary); border: 1px solid var(--primary); }
    .chat-header-name { font-weight: bold; font-size: 16px; color: white; }
    .chat-header-status { font-size: 12px; color: var(--primary); }
    .chat-header-icons { display: flex; gap: 20px; font-size: 20px; cursor: pointer; color: var(--primary); }

    .lang-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: var(--glass-bg); border-bottom: 1px solid var(--glass-border); }
    select { padding: 8px; border: 1px solid var(--glass-border); border-radius: 8px; font-size: 14px; background: rgba(0,0,0,0.3); color: white; width: 42%; outline: none; }
    select option { background: var(--bg-dark); color: white; }

    .chat-container { flex: 1; min-height: 0; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    
    .message { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-wrap: break-word; display: flex; flex-direction: column; gap: 5px; position: relative; backdrop-filter: blur(5px); }
    .message .original { font-size: 12px; color: var(--text-muted); font-style: italic; border-bottom: 1px solid var(--glass-border); padding-bottom: 5px; margin-bottom: 5px; }
    .message .translated { font-size: 16px; font-weight: 500; color: white; }
    
    .msg-a { align-self: flex-start; background: var(--personA); border: 1px solid var(--glass-border); border-top-left-radius: 2px; }
    .msg-b { align-self: flex-end; background: var(--personB); border-top-right-radius: 2px; box-shadow: 0 4px 15px var(--primary-glow); }
    .msg-b .original { color: rgba(255,255,255,0.7); }
    .msg-b .translated { color: white; }
    
    .msg-meta { display: flex; justify-content: flex-end; align-items: center; gap: 3px; font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .msg-b .msg-meta { color: rgba(255,255,255,0.8); }
    .checkmark { font-size: 14px; color: var(--text-muted); }
    .checkmark.read { color: #00d2ff; }

    /* --- INPUT AREA --- */
    .bottom-bar { display: flex; background: rgba(10, 15, 28, 0.9); backdrop-filter: blur(10px); padding: 10px; gap: 8px; align-items: flex-end; border-top: 1px solid var(--glass-border); }
    .input-wrapper { flex: 1; display: flex; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 25px; padding: 5px 15px; align-items: flex-end; min-height: 45px; }
    .input-wrapper textarea { flex: 1; border: none; font-size: 16px; outline: none; padding: 10px 0; background: transparent; resize: none; max-height: 100px; font-family: inherit; line-height: 1.4; color: white; }
    .input-wrapper textarea::placeholder { color: var(--text-muted); }
    .mic-btn { background: none; border: none; font-size: 24px; color: var(--primary); cursor: pointer; padding: 8px; flex-shrink: 0; filter: drop-shadow(0 0 5px var(--primary-glow)); }
    .mic-btn.listening { color: #ff4757; animation: pulse 1.5s infinite; }
    .send-btn { padding: 10px 15px; background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); color: white; border: none; border-radius: 50%; width: 50px; height: 50px; font-weight: bold; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; box-shadow: 0 4px 15px var(--primary-glow); transition: 0.2s; }
    .send-btn:active { transform: scale(0.95); }
    
    /* Call Screen */
    #call-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 999; flex-direction: column; justify-content: center; align-items: center; color: white; }
    .call-container { width: 100%; height: 100%; position: relative; }
    #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: black; }
    #localVideo { position: absolute; bottom: 120px; right: 20px; width: 110px; height: 160px; border-radius: 12px; border: 2px solid var(--primary); object-fit: cover; background: #333; z-index: 10; box-shadow: 0 5px 20px var(--primary-glow); }
    .call-controls { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: center; gap: 40px; }
    .end-call-btn { background: #ff4757; color: white; border: none; border-radius: 50%; width: 65px; height: 65px; font-size: 28px; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 20px rgba(255,71,87,0.6); transition: 0.2s; z-index: 9999; }
    .end-call-btn:active { transform: scale(0.9); }

    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); } }
</style>
</head>
<body>

    <div class="app-container">
        
        <!-- CALL SCREEN -->

            <div class="video-container">
                <div id="remoteVideo"></div>

        <!-- AUTH SCREEN -->
        <div id="authScreen">
            <div class="auth-logo" style="display: flex; justify-content: center; margin-bottom: 20px; filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.4));">
    <svg width="140" height="120" viewBox="0 0 140 120" xmlns="http://www.w3.org/2000/svg">

        <circle cx="35" cy="55" r="2" fill="#00d2ff"/>

        <!-- Right Face (Person B) -->

        <circle cx="105" cy="55" r="2" fill="#3a7bd5"/>
        <circle cx="115" cy="55" r="2" fill="#3a7bd5"/>

        <defs>

        </defs>
    </svg>
</div>
            <div class="auth-title">VoiceBridge AI</div>
            <div id="authError" class="error-msg"></div>
            <input type="email" id="emailInput" class="auth-input" placeholder="Email Address">
            <input type="password" id="passwordInput" class="auth-input" placeholder="Password">
            <button id="authBtn" class="auth-btn">Login</button>
            <div id="switchAuth" class="auth-switch">Don't have an account? Sign Up</div>
        </div>

        <!-- MAIN APP -->
        <div id="mainApp">
            <div class="main-header">
                <h1>VoiceBridge</h1>
                <div class="header-icons">
                    <span onclick="logout()" title="Logout">🚪</span>
                </div>
            </div>
            
            <div id="homeContainer" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
                <div id="chatsTab" class="screen active">
                    <div class="list-item" onclick="openChat()">
                        <div class="avatar">🌍</div>
                        <div class="item-info">
                            <div class="item-name">Global Translator <span class="item-time" id="lastMessageTime">Now</span></div>
                            <div class="item-preview" id="lastMessagePreview">Tap to start translating...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bottom-nav" id="mainNav">
                <div class="nav-item active" onclick="switchTab('chats')">
                    <div class="nav-icon">💬</div>
                    <div class="nav-text">Chats</div>
                </div>
                <div class="nav-item" onclick="switchTab('calls')">
                    <div class="nav-icon">📞</div>
                    <div class="nav-text">Calls</div>
                </div>
            </div>
        </div>

        <!-- CHAT SCREEN -->
        <div id="chatScreen">
            <div class="chat-header">
                <div class="chat-header-left">
                    <span onclick="goHome()">←</span>
                    <div class="chat-header-avatar">🌍</div>
                    <div>
                        <div class="chat-header-name">Global Translator</div>
                        <div class="chat-header-status">online</div>
                    </div>
                </div>
                <div class="chat-header-icons">
                    <!-- The buttons now call the function -->
                    <span title="Video Call" onclick="joinCall(true)">📹</span>
                    <span title="Voice Call" onclick="joinCall(false)">📞</span>
                    <span>⋮</span>
                </div>
            </div>

         <div class="lang-bar">

            <div class="chat-container" id="chatContainer"></div>

            <div class="bottom-bar">
                <div class="input-wrapper">
                    <textarea id="textInput" placeholder="Message..." rows="1"></textarea>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDywymuYlmjORVyBVkyHPl-f6T7WMOi3t4",
            authDomain: "voicebridgeai-92e90.firebaseapp.com",
            projectId: "voicebridgeai-92e90",
            storageBucket: "voicebridgeai-92e90.firebasestorage.app",
            messagingSenderId: "225228601263",
            appId: "1:225228601263:web:96cc6160b884f5f5f6e15a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // AGORA SETUP
        const AGORA_APP_ID = "f12901bdf46f4113b38294f26f518c15"; 
        
        let rtcClient = null;
        let localTracks = { videoTrack: null, audioTrack: null };

        const callScreen = document.getElementById('callScreen');
        const localVideoDiv = document.getElementById('localVideo');
        const remoteVideoDiv = document.getElementById('remoteVideo');

        window.joinCall = async function(withVideo) {
    // 1. Ask Chrome for permission FIRST
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: withVideo });
        // Stop the temporary stream so Agora can use the camera
        stream.getTracks().forEach(track => track.stop());
    } catch (e) {
        alert("Camera/Microphone permission was denied. Please allow it in Chrome settings.");
        return;
    }

    // 2. Now start the Agora call
    callScreen.style.display = 'flex';
    
    remoteVideoDiv.innerHTML = "";

    rtcClient = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });

    rtcClient.on("user-published", async (user, mediaType) => {
        await rtcClient.subscribe(user, mediaType);
        if (mediaType === "video") {
            remoteVideoDiv.innerHTML = "";
            user.videoTrack.play(remoteVideoDiv);
        }
        if (mediaType === "audio") {
            user.audioTrack.play();
        }
    });

    try {
        // Generate a random UID for this session
const uid = 0; 
const tokenResponse = await fetch(`https://voice-bridge-ai-zeta.vercel.app/token?channel=VoiceBridgeRoom&uid=${uid}`);
const tokenData = await tokenResponse.json();

// Join the channel first
await rtcClient.join(AGORA_APP_ID, "VoiceBridgeRoom", tokenData.token, uid);

// Only after joining, create and publish tracks
if (withVideo) {
    localTracks.videoTrack = await AgoraRTC.createCameraVideoTrack();
    localTracks.videoTrack.play(localVideoDiv); 
    localVideoDiv.style.display = 'block';
}
localTracks.audioTrack = await AgoraRTC.createMicrophoneAudioTrack();

let tracksToPublish = [localTracks.audioTrack];
if (localTracks.videoTrack) tracksToPublish.push(localTracks.videoTrack);

await rtcClient.publish(tracksToPublish);
        
    } catch (error) {
        console.error(error);
        alert("Agora could not connect. Error: " + error.message);
        leaveCall();
    }
        }

        window.leaveCall = async function() {
            if (rtcClient) {
                if (localTracks.audioTrack) { localTracks.audioTrack.stop(); localTracks.audioTrack.close(); }
                if (localTracks.videoTrack) { localTracks.videoTrack.stop(); localTracks.videoTrack.close(); }
                await rtcClient.leave();
                rtcClient = null;
            }
           callScreen.style.display = 'none';
localVideoDiv.innerHTML = ""; // Clear the local video
remoteVideoDiv.innerHTML = ""; // Clear the remote video
        }

        // Auth and Chat Logic (Same as before)
        const authScreen = document.getElementById('authScreen');
        const mainApp = document.getElementById('mainApp');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const authBtn = document.getElementById('authBtn');
        const switchAuth = document.getElementById('switchAuth');
        const authError = document.getElementById('authError');
        const homeContainer = document.getElementById('homeContainer');
        const chatScreen = document.getElementById('chatScreen');
        const micBtn = document.getElementById('micBtn');
        const langA = document.getElementById('langA');
        const langB = document.getElementById('langB');
        const chatContainer = document.getElementById('chatContainer');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');

        let isLoginMode = true;
        switchAuth.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            authBtn.innerText = isLoginMode ? "Login" : "Sign Up";
            switchAuth.innerText = isLoginMode ? "Don't have an account? Sign Up" : "Already have an account? Login";
            authError.style.display = 'none';
        });

        authBtn.addEventListener('click', async () => {
            authError.style.display = 'none';
            if (!emailInput.value || !passwordInput.value) return authError.innerText = "Enter email & password.", authError.style.display = 'block';
            try {
                if (isLoginMode) await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
                else await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
            } catch (error) { authError.innerText = error.message; authError.style.display = 'block'; }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) { authScreen.style.display = 'none'; mainApp.style.display = 'flex'; } 
            else { authScreen.style.display = 'flex'; mainApp.style.display = 'none'; }
        });

        window.logout = () => signOut(auth);
        window.openChat = () => { homeContainer.style.display = 'none'; document.getElementById('mainNav').style.display = 'none'; chatScreen.style.display = 'flex'; }
        window.goHome = () => { homeContainer.style.display = 'flex'; document.getElementById('mainNav').style.display = 'flex'; chatScreen.style.display = 'none'; }
        window.switchTab = (t) => alert("Tab feature coming next!");

        function speakText(text, langCode) {
            window.speechSynthesis.cancel(); if (!text) return;
            const utterance = new SpeechSynthesisUtterance(text); utterance.lang = langCode; utterance.rate = 0.9; window.speechSynthesis.speak(utterance);
        }
        function getCurrentTime() { const n = new Date(); return n.getHours() + ":" + n.getMinutes().toString().padStart(2, '0'); }
        function renderMessage(data) {
            const msgDiv = document.createElement('div'); msgDiv.className = data.sender === 'A' ? 'message msg-a' : 'message msg-b';
            msgDiv.innerHTML = `${data.original?`<div class="original">${data.original}</div>`:''}${data.translated?`<div class="translated">${data.translated}</div>`:''}<div class="msg-meta"><span>${data.time}</span><span class="checkmark read">✓✓</span></div>`;
            chatContainer.appendChild(msgDiv); chatContainer.scrollTop = chatContainer.scrollHeight;
            document.getElementById('lastMessagePreview').innerText = data.translated || data.original; document.getElementById('lastMessageTime').innerText = data.time;
        }

        const messagesRef = collection(db, "messages");
        onSnapshot(query(messagesRef, orderBy("timestamp")), (snapshot) => {
            chatContainer.innerHTML = ''; snapshot.forEach((doc) => renderMessage(doc.data()));
        });

        async function sendMessageToDB(sender, original, translated) {
            await addDoc(messagesRef, { sender, original, translated, time: getCurrentTime(), timestamp: Date.now() });
        }

        async function processTranslation(transcript) {
    let translatedText = "";
    if (transcript) {
        try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(transcript)}&langpair=${langA.value.split('-')[0]}|${langB.value.split('-')[0]}`);
            
            if (!res.ok) {
                throw new Error(`API Error: ${res.status}`);
            }
            
            const data = await res.json(); 
            
            if (data.responseData && data.responseData.translatedText) {
                translatedText = data.responseData.translatedText;
            } else if (data.responseStatus === 403 || data.responseStatus === 429) {
                translatedText = "Daily limit reached. Please wait 24 hours.";
            } else {
                translatedText = "Translation failed. Try shorter text.";
            }
            
        } catch (e) { 
            console.error(e);
            translatedText = "Connection failed. Check internet."; 
        }
    }
    sendMessageToDB('A', transcript, translatedText); 
    if (translatedText) speakText(translatedText, langB.value);
}
    // --- TEXT INPUT AND MICROPHONE LOGIC ---
sendBtn.addEventListener('click', () => { 
    const t = textInput.value.trim(); 
    if (!t) return; 
    processTranslation(t); 
    textInput.value = ''; 
    textInput.style.height = 'auto'; 
});

if (window.SpeechRecognition || window.webkitSpeechRecognition) {
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)(); 
    rec.continuous = false; 
    rec.interimResults = false;
    
    micBtn.addEventListener('click', () => { 
        rec.lang = langA.value; 
        try { 
            rec.start(); 
            micBtn.classList.add('listening'); 
        } catch(e) {} 
    });
    
    rec.onresult = (event) => {
        processTranslation(event.results[0][0].transcript);
    };
    rec.onend = () => micBtn.classList.remove('listening'); 
    rec.onerror = () => micBtn.classList.remove('listening');
}
    </script>
</body>
