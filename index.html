<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceBridge AI</title>
    
    <script type="application/json" id="web-app-manifest">
    {
        "name": "VoiceBridge AI",
        "short_name": "VoiceBridge",
        "description": "Real-time multilingual AI voice translation.",
        "start_url": "index.html",
        "display": "standalone",
        "background_color": "#F5F7FA",
        "theme_color": "#4A90E2",
        "icons": [
            {
                "src": "https://cdn-icons-png.flaticon.com/512/2998/2998881.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
            }
        ]
    }
    </script>

    <style>
        :root { --primary-color: #4A90E2; --bg-color: #F5F7FA; --text-color: #333333; --card-bg: #FFFFFF; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        header { text-align: center; padding: 15px 0; }
        h1 { color: var(--primary-color); font-size: 28px; letter-spacing: 1px; }
        .language-controls { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .lang-box { display: flex; flex-direction: column; gap: 5px; width: 40%; }
        label { font-size: 12px; color: #666; font-weight: bold; }
        select { padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; background: white; width: 100%; }
        .swap-btn { background: none; border: none; font-size: 24px; color: var(--primary-color); cursor: pointer; padding: 10px; }
        .mic-section { display: flex; justify-content: center; margin: 20px 0; }
        .mic-btn { width: 100px; height: 100px; border-radius: 50%; background-color: var(--primary-color); color: white; border: none; font-size: 40px; display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 15px rgba(74, 144, 226, 0.4); cursor: pointer; }
        .mic-btn:active { transform: scale(0.95); }
        .text-output { background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); min-height: 120px; display: flex; flex-direction: column; gap: 15px; }
        .text-box { display: flex; flex-direction: column; gap: 5px; }
        .text-box h3 { font-size: 14px; color: #666; text-transform: uppercase; }
        .text-box p { font-size: 18px; min-height: 25px; color: var(--text-color); }
        .divider { height: 1px; background: #eee; width: 100%; }
        .play-btn { align-self: flex-end; background-color: #E2EAF4; color: var(--primary-color); border: none; padding: 10px 20px; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <div class="app-container">
        <header><h1>VOICEBRIDGE AI</h1></header>
        <div class="language-controls">
            <div class="lang-box">
                <label>My Language</label>
                <select id="sourceLang">
                    <option value="ur-PK">Urdu</option>
                    <option value="en-US">English</option>
                    <option value="ar-SA">Arabic</option>
                    <option value="es-ES">Spanish</option>
                    <option value="fr-FR">French</option>
                    <option value="zh-CN">Chinese</option>
                    <option value="ja-JP">Japanese</option>
                </select>
            </div>
            <button class="swap-btn" id="swapBtn" title="Swap Languages">⇄</button>
            <div class="lang-box">
                <label>Other Language</label>
                <select id="targetLang">
                    <option value="en-US">English</option>
                    <option value="ur-PK">Urdu</option>
                    <option value="ar-SA">Arabic</option>
                    <option value="es-ES">Spanish</option>
                    <option value="fr-FR">French</option>
                    <option value="zh-CN">Chinese</option>
                    <option value="ja-JP">Japanese</option>
                </select>
            </div>
        </div>
        <div class="mic-section">
            <button class="mic-btn" id="micBtn">🎤</button>
        </div>
        <div class="text-output">
            <div class="text-box">
                <h3>Original Speech</h3>
                <p id="originalText">...</p>
            </div>
            <div class="divider"></div>
            <div class="text-box">
                <h3>Translation</h3>
                <p id="translatedText">...</p>
            </div>
            <button class="play-btn" id="playBtn">🔊 PLAY</button>
        </div>
    </div>
    <script>
        const micBtn = document.getElementById('micBtn');
        const originalText = document.getElementById('originalText');
        const translatedText = document.getElementById('translatedText');
        const sourceLang = document.getElementById('sourceLang');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function speakText(text, langCode) {
            window.speechSynthesis.cancel();
            if (!text || text.includes("Translation failed") || text.includes("error")) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode; 
            utterance.rate = 0.9; 
            window.speechSynthesis.speak(utterance);
        }

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false; 
            recognition.interimResults = false; 

            micBtn.addEventListener('click', () => {
                if (originalText.innerText === "Listening...") {
                    recognition.stop();
                    return;
                }
                recognition.lang = sourceLang.value; 
                try {
                    recognition.start();
                    originalText.innerText = "Listening...";
                    translatedText.innerText = "...";
                } catch(e) {
                    originalText.innerText = "Error: Microphone already listening.";
                }
            });

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                originalText.innerText = transcript;
                translatedText.innerText = "Translating...";
                const fromLang = sourceLang.value.split('-')[0]; 
                const toLang = document.getElementById('targetLang').value.split('-')[0]; 
                try {
                    const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(transcript)}&langpair=${fromLang}|${toLang}`);
                    const data = await response.json();
                    if (data.responseData && data.responseData.translatedText) {
                        translatedText.innerText = data.responseData.translatedText;
                        speakText(data.responseData.translatedText, document.getElementById('targetLang').value);
                    } else {
                        translatedText.innerText = "Translation failed. Please try again.";
                    }
                } catch (error) {
                    translatedText.innerText = "Network error. Check your internet.";
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed') {
                    originalText.innerText = "Microphone permission denied. Please allow it.";
                } else {
                    originalText.innerText = "Error: " + event.error;
                }
            };

            recognition.onend = () => {
                if (originalText.innerText === "Listening...") {
                    originalText.innerText = "..."; 
                }
            };
        } else {
            micBtn.addEventListener('click', () => {
                originalText.innerText = "Speech recognition is not supported. Please use Google Chrome.";
            });
        }

        document.getElementById('swapBtn').addEventListener('click', () => {
            const source = document.getElementById('sourceLang');
            const target = document.getElementById('targetLang');
            const temp = source.value;
            source.value = target.value;
            target.value = temp;
        });

        document.getElementById('playBtn').addEventListener('click', () => {
            const textToSpeak = translatedText.innerText;
            const targetLang = document.getElementById('targetLang').value;
            if (textToSpeak && textToSpeak !== "...") {
                speakText(textToSpeak, targetLang);
            }
        });
    </script>
</body>
  </html>
